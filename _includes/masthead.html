{% include base_path %}

<!-- EXPERIMENT: the same photos, blurred, behind the whole site (see _sass/_site-bg.scss) -->
<div class="site-bg" aria-hidden="true"></div>
<div class="masthead masthead--photos">
  <!-- EXPERIMENT: Seasons photos slowly cross-fading behind the top bar (see _sass/_masthead-photos.scss) -->
  <div class="masthead__photos" aria-hidden="true"
       data-base="{{ base_path }}/images/seasons/"
       data-photos="2023-09,2023-10,2023-11,2023-12,2024-02,2024-03,2025-01,2025-10,2026-05,2026-11"></div>
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg"><a href="{{ base_path }}/">{{ site.title }}</a></li>
          <li class="masthead__menu-item masthead__menu-item--theme">
            <!-- a span, not a <button>: the greedy-nav script hides every button inside #site-nav -->
            <span id="theme-toggle" class="theme-toggle" role="button" tabindex="0" aria-label="Toggle dark mode" title="Toggle dark mode">
              <i class="fas fa-moon theme-toggle__icon--moon" aria-hidden="true"></i>
              <i class="fas fa-sun theme-toggle__icon--sun" aria-hidden="true"></i>
            </span>
          </li>
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
              {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}">{{ link.title }}</a></li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
<script>
  /* EXPERIMENT: cross-fade the Seasons photos behind the top bar, one every 6s */
  (function () {
    var box = document.querySelector('.masthead__photos');
    if (!box) return;
    var base = box.getAttribute('data-base');
    var names = box.getAttribute('data-photos').split(',');
    var still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var bg = document.querySelector('.site-bg');
    var layers = names.map(function (n, k) {
      var d = document.createElement('div');
      d.className = 'masthead__photo' + (k === 0 ? ' is-active' : '');
      box.appendChild(d);
      var b = null;
      if (bg) {
        b = document.createElement('div');
        b.className = 'site-bg__photo' + (k === 0 ? ' is-active' : '');
        bg.appendChild(b);
      }
      return { top: d, bg: b };
    });
    var i = 0;
    function load(k) {
      var L = layers[k];
      if (L.top.style.backgroundImage) return;
      var url = 'url(' + base + names[k] + '.jpg)';
      L.top.style.backgroundImage = url;
      if (L.bg) L.bg.style.backgroundImage = url;
    }
    function set(k, on) {
      layers[k].top.classList.toggle('is-active', on);
      if (layers[k].bg) layers[k].bg.classList.toggle('is-active', on);
    }
    load(0);
    window.addEventListener('load', function () { load(1); });
    function next() {
      var j = (i + 1) % layers.length;
      load(j); load((j + 1) % layers.length); /* also fetch the one after, so it's ready */
      set(i, false);
      set(j, true);
      i = j;
    }
    if (!still) setInterval(next, 6000);
  })();
  (function () {
    var root = document.documentElement;
    var btn = document.getElementById('theme-toggle');
    function sync() {
      btn.setAttribute('aria-pressed', root.getAttribute('data-theme') === 'dark' ? 'true' : 'false');
    }
    sync();
    function toggle() {
      var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) {}
      sync();
    }
    /* nudge the toggle so it sits exactly above the sidebar's vertical divider line */
    function alignToDivider() {
      btn.style.transform = '';
      var siteTitle = document.querySelector('.masthead__menu-item--lg a');
      if (siteTitle) siteTitle.style.transform = '';
      var sb = document.querySelector('.sidebar');
      if (!sb) return;
      var line = getComputedStyle(sb, '::before');
      if (line.content === 'none' || line.position !== 'absolute') return; /* no line on narrow screens */
      var s = sb.getBoundingClientRect();
      var lineCenter = s.right - parseFloat(line.right) - parseFloat(line.width) / 2;
      var b = btn.getBoundingClientRect();
      btn.style.transform = 'translateX(' + (lineCenter - (b.left + b.width / 2) + 1) + 'px)'; /* +1px looks better centered */
      /* center the site title above the profile photo */
      var name = document.querySelector('.masthead__menu-item--lg a');
      var img = document.querySelector('.author__avatar img');
      if (name && img) {
        name.style.transform = '';
        var n = name.getBoundingClientRect(), i = img.getBoundingClientRect();
        name.style.transform = 'translateX(' + ((i.left + i.width / 2) - (n.left + n.width / 2) + 5) + 'px)'; /* +5px looks better centered */
      }
    }
    window.addEventListener('load', alignToDivider);
    window.addEventListener('resize', alignToDivider);
    btn.addEventListener('click', toggle);
    btn.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
    });
  })();
</script>
